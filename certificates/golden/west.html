<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,follow">
<title>Golden Cruise Certificate — West Coast / Mexico</title>
<style>
html,body{margin:0;min-height:100%;background:#101c24}
#golden-frame{display:block;width:100%;height:100dvh;border:0;background:#101c24}
</style>
</head>
<body>
<iframe id="golden-frame" title="Golden Cruise Certificate" src="/certificates/GOLDEN-CRUISE-CERTIFICATES.DEPLOY.html?collection=west-coast-mexico#west"></iframe>
<script>
(function(){
  var frame=document.getElementById('golden-frame');
  frame.addEventListener('load',function(){
    try{
      var doc=frame.contentDocument;
      if(!doc)return;
      var style=doc.createElement('style');
      style.id='hvm-golden-repair';
      style.textContent=
        '.certificate-window{display:block!important;max-width:600px!important;margin:auto!important;padding:5px 10px 25px!important}'+
        '.stage.companion{display:none!important}'+
        '.side-label{display:none!important}'+
        '.stage.turning .paper-shadow{animation:none!important}'+
        '.card{transition:transform .58s cubic-bezier(.18,.82,.26,1.12)!important}'+
        '.sheen{background:radial-gradient(ellipse at var(--mx,32%) var(--my,16%),rgba(255,252,232,.20),rgba(255,246,199,.05) 24%,transparent 54%)!important;mix-blend-mode:screen!important}'+
        '@media(prefers-reduced-motion:reduce){.card,.tilt{transition:none!important}.sheen{display:none!important}.tilt{transform:none!important}}';
      doc.head.appendChild(style);
      doc.documentElement.setAttribute('data-hvm-route','west');
    }catch(e){
      console.error('Golden repair wrapper failed',e);
    }
  });
})();
</script>
</body>
</html>
